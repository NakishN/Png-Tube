name: Release PNGTuber

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller qtpy

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name PNGTuber --add-data "web;web" --hidden-import PyQt6 --hidden-import qtpy --hidden-import sounddevice --hidden-import PyQt6.QtWebEngineCore --hidden-import PyQt6.QtWebEngineWidgets main.py
          Compress-Archive -Path dist\PNGTuber -DestinationPath dist\PNGTuber-Windows.zip

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install dependencies required for PyQt6
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libportaudio2
          pyinstaller --noconfirm --onedir --windowed --name PNGTuber --add-data "web:web" --hidden-import PyQt6 --hidden-import qtpy --hidden-import sounddevice --hidden-import PyQt6.QtWebEngineCore --hidden-import PyQt6.QtWebEngineWidgets main.py
          cd dist && zip -r PNGTuber-Linux.zip PNGTuber

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name PNGTuber --add-data "web:web" --hidden-import PyQt6 --hidden-import qtpy --hidden-import sounddevice --hidden-import PyQt6.QtWebEngineCore --hidden-import PyQt6.QtWebEngineWidgets main.py
          cd dist && ditto -c -k --keepParent PNGTuber.app PNGTuber-macOS.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Executables-${{ matrix.os }}
          path: dist/PNGTuber-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist


      - name: Pick release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"; else echo "TAG=latest" >> "$GITHUB_ENV"; fi

      - name: Delete existing release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$TAG" -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/PNGTuber-*.zip
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "PNGTuber ${{ env.TAG }}"
          body: "Лёгкий PNGTuber (Python/PyQt6). Распакуйте архив целиком и запустите PNGTuber."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release PNGTuber

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller qtpy

      - name: Build Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "index.html;." --add-data "idle.png;." --add-data "speaking.png;." --hidden-import PyQt6 --hidden-import qtpy --hidden-import PyQt6.QtWebEngineCore --hidden-import PyQt6.QtWebEngineWidgets main.py
          Move-Item -Path dist\main.exe -Destination dist\PNGTuber-Windows.exe

      - name: Build Executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install dependencies required for PyQt6
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0
          pyinstaller --noconfirm --onefile --windowed --add-data "index.html:." --add-data "idle.png:." --add-data "speaking.png:." --hidden-import PyQt6 --hidden-import qtpy --hidden-import PyQt6.QtWebEngineCore --hidden-import PyQt6.QtWebEngineWidgets main.py
          mv dist/main dist/PNGTuber-Linux

      - name: Build Executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "index.html:." --add-data "idle.png:." --add-data "speaking.png:." --hidden-import PyQt6 --hidden-import qtpy --hidden-import PyQt6.QtWebEngineCore --hidden-import PyQt6.QtWebEngineWidgets main.py
          mv dist/main dist/PNGTuber-macOS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Executables-${{ matrix.os }}
          path: |
            dist/PNGTuber-Windows.exe
            dist/PNGTuber-Linux
            dist/PNGTuber-macOS
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist


      - name: Delete existing release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v1.0.0 -y --cleanup-tag || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/PNGTuber-Linux
            dist/**/PNGTuber-macOS
          tag_name: "v1.0.0"
          name: "PNGTuber 1.0.0"
          body: "Легкий PNGTuber (Cross-platform Python/PyQt6)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

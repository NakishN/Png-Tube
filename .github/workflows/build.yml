name: Build check

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'PNGTuber.spec'
      - 'requirements.txt'
      - 'web/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 \
            libopengl0 libportaudio2 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libgbm1
          pyinstaller --noconfirm --clean PNGTuber.spec
          cd dist && zip -r PNGTuber-Linux.zip PNGTuber

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean PNGTuber.spec
          Compress-Archive -Path dist\PNGTuber -DestinationPath dist\PNGTuber-Windows.zip

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean PNGTuber.spec
          cd dist && ditto -c -k --keepParent PNGTuber.app PNGTuber-macOS.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/PNGTuber-*.zip
          if-no-files-found: error
